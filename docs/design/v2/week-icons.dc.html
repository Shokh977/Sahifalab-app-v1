<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Seriya belgilari</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 680px; height: 600px; box-sizing: border-box; padding: 32px; background: #F7F3EC; color: #1C2530; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column; gap: 26px;">

<svg width="0" height="0" style="position: absolute;" aria-hidden="true">
<defs>
<linearGradient id="sFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB547"></stop><stop offset=".55" stop-color="#F7711E"></stop><stop offset="1" stop-color="#E2500C"></stop></linearGradient>
<linearGradient id="sDepth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C7440A"></stop><stop offset="1" stop-color="#9E3306"></stop></linearGradient>
<linearGradient id="sFlame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#FFE7C7"></stop></linearGradient>
<linearGradient id="sCore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD54A"></stop><stop offset="1" stop-color="#FF9A1F"></stop></linearGradient>

<linearGradient id="iTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4FBFF"></stop><stop offset="1" stop-color="#C6E9FF"></stop></linearGradient>
<linearGradient id="iLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD2FF"></stop><stop offset="1" stop-color="#3A8EE6"></stop></linearGradient>
<linearGradient id="iRight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8E3FF"></stop><stop offset="1" stop-color="#5DAEF2"></stop></linearGradient>

<linearGradient id="mFaceL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFEBE4"></stop><stop offset="1" stop-color="#DAD4CA"></stop></linearGradient>
<linearGradient id="mDepthL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9C2B6"></stop><stop offset="1" stop-color="#B5AD9F"></stop></linearGradient>
<linearGradient id="mFaceD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34343C"></stop><stop offset="1" stop-color="#26262C"></stop></linearGradient>
<linearGradient id="mDepthD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18181C"></stop><stop offset="1" stop-color="#101013"></stop></linearGradient>
</defs>
</svg>

<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.9px; color: #5B6573;">SERIYA BELGILARI · v3</span>
<span style="font-size: 15px; color: #5B6573;">3D plitkalar: olov, muz kubi, oʻchgan olov tutuni, bugungi kun</span>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;">

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
<svg width="104" height="104" viewBox="0 0 64 64" role="img" aria-label="Bajarildi">
<ellipse cx="32" cy="60" rx="20" ry="2.5" fill="#E2500C" fill-opacity=".18"></ellipse>
<rect x="5" y="7" width="54" height="52" rx="17" fill="url(#sDepth)"></rect>
<rect x="5" y="4" width="54" height="51" rx="17" fill="url(#sFace)"></rect>
<path d="M14 12c4-4 10-5 18-5s14 1 18 5c-5-1-11-1.6-18-1.6S19 11 14 12z" fill="#FFFFFF" fill-opacity=".45"></path>
<path d="M32 12.5c2.2 7.5 12.5 11.5 12.5 22.8a12.5 12.5 0 0 1-25 0c0-5.4 2.6-8.6 5.2-10.4 0 4.3 2.1 6.8 4.7 6.8C27 25 28.2 19 32 12.5z" fill="url(#sFlame)"></path>
<path d="M32 29.5c1.3 3.2 5.4 5 5.4 9.8a5.4 5.4 0 0 1-10.8 0c0-2.8 1.4-4.3 2.8-5.1.2 2.1 1.1 3 2.2 3C30.4 34.6 30.6 32 32 29.5z" fill="url(#sCore)"></path>
<path d="M48.5 12.5l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z" fill="#FFFFFF"></path>
</svg>
<span style="font-size: 15px; font-weight: 700;">Bajarildi</span>
<span style="font-size: 12px; color: #5B6573; text-align: center;">Olovli plitka · seriya rangi</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
<svg width="104" height="104" viewBox="0 0 64 64" role="img" aria-label="Muzlatildi">
<ellipse cx="32" cy="60" rx="19" ry="2.5" fill="#3A8EE6" fill-opacity=".2"></ellipse>
<path d="M32 6 55 18.5 32 31 9 18.5z" fill="url(#iTop)"></path>
<path d="M9 18.5 32 31v25L9 43.5z" fill="url(#iLeft)"></path>
<path d="M55 18.5 32 31v25l23-12.5z" fill="url(#iRight)"></path>
<path d="M9 18.5 32 6l23 12.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round" stroke-opacity=".9"></path>
<path d="M32 31v25" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity=".7"></path>
<path d="M13 23.5 13 36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity=".45"></path>
<g transform="translate(32 18.5) scale(1 .54)" stroke="#5AA9EE" stroke-width="2" stroke-linecap="round" fill="none">
<path d="M0-12V12M-10.4-6 10.4 6M-10.4 6 10.4-6"></path>
<path d="M-3-9.5 0-7l3-2.5M-3 9.5 0 7l3 2.5M-11-1.6l2.8 3.6M11-1.6 8.2 2M-11 1.6l2.8-3.6M11 1.6 8.2-2"></path>
</g>
<path d="M14 46.2 17.5 48l-1.6 6z" fill="#8FD2FF"></path>
<path d="M22 50.5 25.4 52.3l-1.4 5z" fill="#7CC6FF"></path>
<path d="M44 49.6 47.6 47.8 46.8 53.4z" fill="#A9DBFF"></path>
<path d="M51 9.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z" fill="#8FD2FF"></path>
<circle cx="8" cy="10" r="1.2" fill="#8FD2FF"></circle>
</svg>
<span style="font-size: 15px; font-weight: 700;">Muzlatildi</span>
<span style="font-size: 12px; color: #5B6573; text-align: center;">Muz kubi · seriya saqlandi</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
<svg width="104" height="104" viewBox="0 0 64 64" role="img" aria-label="Oʻtkazildi">
<rect x="5" y="7" width="54" height="52" rx="17" fill="url(#mDepthL)"></rect>
<rect x="5" y="4" width="54" height="51" rx="17" fill="url(#mFaceL)"></rect>
<path d="M14 12c4-4 10-5 18-5s14 1 18 5c-5-1-11-1.6-18-1.6S19 11 14 12z" fill="#FFFFFF" fill-opacity=".55"></path>
<ellipse cx="32" cy="44" rx="11" ry="3.6" fill="#B9B1A4"></ellipse>
<path d="M24.5 43.2c2-3.2 5-4.6 7.5-4.6s5.5 1.4 7.5 4.6" fill="#A39B8D"></path>
<circle cx="30" cy="41.2" r="1.1" fill="#E2500C" fill-opacity=".55"></circle>
<path d="M32 37c-4-3.4-4-7.4 0-10.4s4-7 0-10.6" fill="none" stroke="#9E978B" stroke-width="3" stroke-linecap="round"></path>
<path d="M37 33c-2.4-2-2.4-4.3 0-6.2" fill="none" stroke="#B5AD9F" stroke-width="2.4" stroke-linecap="round"></path>
</svg>
<span style="font-size: 15px; font-weight: 700;">Oʻtkazildi</span>
<span style="font-size: 12px; color: #5B6573; text-align: center;">Oʻchgan olov · kul va tutun</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
<svg width="104" height="104" viewBox="0 0 64 64" role="img" aria-label="Bugun, hali bajarilmagan">
<rect x="6" y="5" width="52" height="52" rx="17" fill="#FFFFFF" stroke="#EE5A12" stroke-width="2.4" stroke-dasharray="5 4"></rect>
<path d="M32 17c1.8 6 10 9.2 10 18.2a10 10 0 0 1-20 0c0-4.3 2-6.9 4.2-8.3 0 3.4 1.7 5.4 3.7 5.4C28 26.8 29 22 32 17z" fill="#EE5A12" fill-opacity=".12" stroke="#EE5A12" stroke-width="2" stroke-linejoin="round"></path>
</svg>
<span style="font-size: 15px; font-weight: 700;">Bugun</span>
<span style="font-size: 12px; color: #5B6573; text-align: center;">Hali yonmagan olov</span>
</div>

</div>

<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.9px; color: #5B6573;">HAQIQIY OʻLCHAMDA (40 px)</span>
<sc-for list="{{strips}}" as="s" hint-placeholder-count="2">
<div style="border-radius: 20px; padding: 14px 16px; background: {{s.bg}}; border: 1px solid {{s.border}}; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
<sc-for list="{{s.days}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
<sc-if value="{{d.done}}" hint-placeholder-val="{{true}}">
<svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><rect x="5" y="7" width="54" height="52" rx="17" fill="url(#sDepth)"></rect><rect x="5" y="4" width="54" height="51" rx="17" fill="url(#sFace)"></rect><path d="M14 12c4-4 10-5 18-5s14 1 18 5c-5-1-11-1.6-18-1.6S19 11 14 12z" fill="#FFFFFF" fill-opacity=".45"></path><path d="M32 12.5c2.2 7.5 12.5 11.5 12.5 22.8a12.5 12.5 0 0 1-25 0c0-5.4 2.6-8.6 5.2-10.4 0 4.3 2.1 6.8 4.7 6.8C27 25 28.2 19 32 12.5z" fill="url(#sFlame)"></path><path d="M32 29.5c1.3 3.2 5.4 5 5.4 9.8a5.4 5.4 0 0 1-10.8 0c0-2.8 1.4-4.3 2.8-5.1.2 2.1 1.1 3 2.2 3C30.4 34.6 30.6 32 32 29.5z" fill="url(#sCore)"></path></svg>
</sc-if>
<sc-if value="{{d.frozen}}" hint-placeholder-val="{{false}}">
<svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 55 18.5 32 31 9 18.5z" fill="url(#iTop)"></path><path d="M9 18.5 32 31v25L9 43.5z" fill="url(#iLeft)"></path><path d="M55 18.5 32 31v25l23-12.5z" fill="url(#iRight)"></path><path d="M9 18.5 32 6l23 12.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path><g transform="translate(32 18.5) scale(1 .54)" stroke="#5AA9EE" stroke-width="2.6" stroke-linecap="round"><path d="M0-12V12M-10.4-6 10.4 6M-10.4 6 10.4-6"></path></g><path d="M14 46.2 17.5 48l-1.6 6z" fill="#8FD2FF"></path><path d="M44 49.6 47.6 47.8 46.8 53.4z" fill="#A9DBFF"></path></svg>
</sc-if>
<sc-if value="{{d.missed}}" hint-placeholder-val="{{false}}">
<svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><rect x="5" y="7" width="54" height="52" rx="17" fill="{{s.mDepth}}"></rect><rect x="5" y="4" width="54" height="51" rx="17" fill="{{s.mFace}}"></rect><ellipse cx="32" cy="44" rx="11" ry="3.6" fill="{{s.ash}}"></ellipse><path d="M24.5 43.2c2-3.2 5-4.6 7.5-4.6s5.5 1.4 7.5 4.6" fill="{{s.ash2}}"></path><path d="M32 37c-4-3.4-4-7.4 0-10.4s4-7 0-10.6" fill="none" stroke="{{s.smoke}}" stroke-width="3.6" stroke-linecap="round"></path></svg>
</sc-if>
<sc-if value="{{d.today}}" hint-placeholder-val="{{false}}">
<svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="5" width="52" height="52" rx="17" fill="{{s.todayFill}}" stroke="#EE5A12" stroke-width="3" stroke-dasharray="6 5"></rect><path d="M32 17c1.8 6 10 9.2 10 18.2a10 10 0 0 1-20 0c0-4.3 2-6.9 4.2-8.3 0 3.4 1.7 5.4 3.7 5.4C28 26.8 29 22 32 17z" fill="#EE5A12" fill-opacity=".14" stroke="#EE5A12" stroke-width="2.6" stroke-linejoin="round"></path></svg>
</sc-if>
<span style="font-size: 12px; font-weight: {{d.weight}}; color: {{d.ink}};">{{d.label}}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":680,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    var labels = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
    var states = ['done', 'frozen', 'done', 'missed', 'done', 'done', 'today'];
    function strip(dark) {
      var t = dark
        ? { bg: '#17171B', border: '#2B2B32', text: '#F4F2EE', muted: '#A3A1A8', mFace: 'url(#mFaceD)', mDepth: 'url(#mDepthD)', ash: '#4A4A52', ash2: '#5A5A63', smoke: '#7A7882', todayFill: '#17171B' }
        : { bg: '#FFFFFF', border: '#ECE5D8', text: '#1C2530', muted: '#5B6573', mFace: 'url(#mFaceL)', mDepth: 'url(#mDepthL)', ash: '#B9B1A4', ash2: '#A39B8D', smoke: '#9E978B', todayFill: '#FFFFFF' };
      var days = labels.map(function (l, i) {
        var s = states[i];
        return { label: l, done: s === 'done', frozen: s === 'frozen', missed: s === 'missed', today: s === 'today',
          weight: s === 'today' ? '800' : '600', ink: s === 'today' ? t.text : t.muted };
      });
      return Object.assign({}, t, { days: days });
    }
    return { strips: [strip(false), strip(true)] };
  }
}
</script>
</body>
</html>
